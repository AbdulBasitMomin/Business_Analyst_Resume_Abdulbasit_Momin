name: Deploy resume site

# Publishes the static site to GitHub Pages. No build step: the site is plain
# ES modules and loads Three.js from a CDN via importmap.
on:
  push:
    branches: [claude/3d-resume-website-rqm1j9, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        # Creates the Pages site on first run so no manual repo setting is needed.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
