name: Mirror to the bare domain

# Copies the published site into the user-site repo, so
# abdulbasitmomin.github.io and the project site never drift apart.
#
# ONE-TIME SETUP
#   1. Create a fine-grained personal access token that can write to
#      AbdulBasitMomin/abdulbasitmomin.github.io:
#      github.com/settings/personal-access-tokens/new
#        Repository access -> Only select repositories -> abdulbasitmomin.github.io
#        Permissions -> Repository permissions -> Contents: Read and write
#   2. Add it to THIS repo as a secret named MIRROR_TOKEN:
#      Settings -> Secrets and variables -> Actions -> New repository secret
#
# After that it runs itself on every push to main. Without the secret it exits
# cleanly rather than failing the build, so nothing here breaks if it is never
# set up.

on:
  workflow_run:
    # Runs after the site deploy, so the mirror copies what actually shipped.
    workflows: ['Deploy resume site']
    types: [completed]
  workflow_dispatch:
    inputs:
      root:
        description: 'Which page sits at the bare domain root'
        required: true
        default: portfolio
        type: choice
        options: [portfolio, me, landing, resume]

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Do not mirror a deploy that failed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5

      - name: Check the token is present
        id: gate
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::MIRROR_TOKEN is not set, so nothing was mirrored. See the header of this workflow for setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Which page answers at the bare domain root. Change the default on the
      # line below to move the front door; everything else stays reachable at
      # its own path either way.
      - name: Assemble the tree
        if: steps.gate.outputs.ready == 'true'
        env:
          ROOT: ${{ github.event.inputs.root || 'portfolio' }}
        run: |
          set -eu
          rm -rf site && mkdir site

          # Everything the site serves. The build tooling is not part of it.
          # tar rather than rsync: one less thing that has to be on the runner.
          # landing/ is the reference recreation -- someone else's name, awards
          # and hotlinked video. It stays on the project site, not on a personal
          # domain.
          tar -cf - --exclude=./.git --exclude=./.github --exclude=./dist \
              --exclude=./tools --exclude=./portfolio-landing --exclude=./site \
              --exclude=./landing --exclude=./README.md . \
            | tar -xf - -C site

          if [ "$ROOT" != "resume" ]; then
            # The resume's markup uses relative asset paths, so it only moves as
            # a whole: index.html and assets/ travel together into /resume/.
            mkdir -p site/resume
            mv site/index.html site/assets site/sitemap.xml site/robots.txt site/resume/ 2>/dev/null || true

            # The chosen page is self-contained (its own index.html + assets/),
            # so its contents become the root.
            cp -r "site/$ROOT/." site/
          fi

          echo "Root is: $ROOT"
          find site -maxdepth 2 -name index.html | sort

      - name: Push
        if: steps.gate.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -eu
          TARGET=AbdulBasitMomin/abdulbasitmomin.github.io
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${TARGET}.git" out
          BRANCH=$(git -C out rev-parse --abbrev-ref HEAD)

          # Replace the tree wholesale, but keep the repo's own git history and
          # anything GitHub Pages needs to keep seeing.
          find out -mindepth 1 -maxdepth 1 \
               ! -name .git ! -name CNAME ! -name .nojekyll -exec rm -rf {} +
          cp -r site/. out/
          touch out/.nojekyll

          cd out
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "Already identical, nothing to push."
          else
            git commit -m "Mirror ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push origin "HEAD:${BRANCH}"
            echo "Pushed to ${TARGET} (${BRANCH})."
          fi
