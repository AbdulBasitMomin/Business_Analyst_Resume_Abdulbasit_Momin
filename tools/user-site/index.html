<!--
  This is the whole of the abdulbasitmomin.github.io repository.

  The resume lives in one place, the Business_Analyst_Resume_Abdulbasit_Momin
  repository, because that URL is already printed on a resume that has been
  sent out and has to keep working. Serving a second copy from here would mean
  every future edit had to be made twice, and the two would drift: the resume
  PDF already went wrong that exact way once, listing different certifications
  from the page.

  So this file forwards instead. One page to paste, never edited again.
-->

<link rel="canonical" href="https://abdulbasitmomin.github.io/Business_Analyst_Resume_Abdulbasit_Momin/" />

<meta name="robots" content="noindex, follow" />

<style>
  html { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0a0b0f; color: #edeff3; text-align: center;
    font-family: system-ui, -apple-system, sans-serif; font-weight: 300;
    padding: 1.5rem;
  }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 0.4rem; }
  p { margin: 0 0 1.1rem; font-size: 0.9rem; color: #a8aeba; }
  a {
    display: inline-block; padding: 0.7rem 1.15rem; border-radius: 10px;
    background: #5590d8; color: #06080c; font-weight: 600; font-size: 0.9rem;

  }
</style>
</head>
<body>
  <main>
    <h1>Abdulbasit Momin, Business Analyst</h1>

  </main>

<script>
  // Carry the query and hash across, so a shared deep link keeps working:
  // ?trace=SQL selects one capability and #experience jumps to a section, and
  // a bare meta refresh would drop both.
  (function () {
    var base = 'https://abdulbasitmomin.github.io/Business_Analyst_Resume_Abdulbasit_Momin/';
    var target = base + location.search + location.hash;
    document.getElementById('go').href = target;
    location.replace(target);
  })();
</script>
