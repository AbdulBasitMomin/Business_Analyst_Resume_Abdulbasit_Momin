# ============================================================================
# THIS FILE GOES IN THE OTHER REPO, NOT THIS ONE.
#
#   github.com/AbdulBasitMomin/abdulbasitmomin.github.io
#     -> Add file -> Create new file
#     -> name it:  .github/workflows/sync.yml
#     -> paste this whole file -> Commit
#
# That is the only step. No personal access token, no local clone: a workflow
# writing to its own repository already has permission, which is why this pulls
# from the resume site rather than the resume site pushing to it.
#
# Committing it starts the first run by itself. After that it runs on every
# push here and every three hours, and there is a Run workflow button on
# Actions -> "Sync from the resume site" for when you do not want to wait.
#
# IF THE RUN FAILS ON THE PUSH STEP, the repo is set to read-only for Actions:
#   Settings -> Actions -> General -> Workflow permissions
#   -> "Read and write permissions" -> Save
# ============================================================================
name: Sync from the resume site

on:
  # Runs the moment this file is committed, so installing it is the whole
  # setup. Pushes made by a workflow's own GITHUB_TOKEN do not start further
  # runs, so the commit at the end of this job cannot loop back into it.
  push:
    branches: [main]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      root:
        description: 'Which page answers at the bare domain root'
        required: true
        default: portfolio
        type: choice
        options: [portfolio, me, resume]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this site
        uses: actions/checkout@v5

      - name: Fetch the published resume site
        run: |
          set -eu
          git clone --depth 1 \
            https://github.com/AbdulBasitMomin/Business_Analyst_Resume_Abdulbasit_Momin.git src
          echo "source is at $(git -C src rev-parse --short HEAD)"

      - name: Assemble the tree
        env:
          # The front door. Change the fallback to move it; every other page
          # stays reachable at its own path either way.
          ROOT: ${{ github.event.inputs.root || 'portfolio' }}
        run: |
          set -eu
          rm -rf site && mkdir site

          # What the site serves, minus the build tooling. landing/ is left out
          # on purpose: it is a recreation of a reference design carrying
          # another person's name and awards over a video hotlinked from their
          # CDN. Fine on a project site, not on a personal domain.
          # './.*' drops every top-level dotfile at once -- .git, .github,
          # .gitignore, editor and tool config. None of them is site content,
          # and listing them one by one means the next one that appears gets
          # published by accident.
          tar -cf - -C src \
              --exclude='./.*' --exclude=./dist --exclude=./tools \
              --exclude=./portfolio-landing --exclude=./landing \
              --exclude=./README.md . \
            | tar -xf - -C site

          if [ "$ROOT" != "resume" ]; then
            # The resume's markup uses relative asset paths, so it only moves as
            # a unit: index.html and assets/ have to travel together.
            mkdir -p site/resume
            mv site/index.html site/assets site/sitemap.xml site/robots.txt site/resume/
            # The chosen page is self-contained, so its contents become the root.
            cp -r "site/$ROOT/." site/
          fi

          echo "Root: $ROOT"
          find site -maxdepth 2 -name index.html | sort

      - name: Commit if anything changed
        run: |
          set -eu
          # Replace the tree, but keep this repo's history and the two files
          # Pages needs to keep seeing.
          find . -mindepth 1 -maxdepth 1 \
               ! -name .git ! -name .github ! -name CNAME ! -name .nojekyll \
               ! -name site ! -name src -exec rm -rf {} +
          cp -r site/. .
          rm -rf site src
          touch .nojekyll

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date."
          else
            git commit -m "Sync from the resume site"
            git push
          fi
